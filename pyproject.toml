# -----------------------------------------------------------------------------
[project]
name = "xyh_ml"
version = "0.0.1alpha"
description = "Machine learning developments for the X &rightarrow; YH &rightarrow; bb&tau;&tau; analysis"
authors = [ { name = "Moritz Molch", email = "moritz.molch@kit.edu" } ]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightning>=2.6.6,<3",
    "mlflow>=1.27.0,<2",
    "numpy",
    "pandas>=3.1.0,<4",
    "tables>=3.11.1,<4",
    "pydantic>=2.14.1,<3",
    "scikit-learn>=1.9.1,<2",
    "matplotlib>=3.11.2,<4",
    "mplhep>=1.3.3,<2",
    "hist>=2.12.0,<3",
    "seaborn>=0.13.2,<0.14",
    "hydra-core>=1.3.8,<2"
]

# -----------------------------------------------------------------------------

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xyh_ml"]

# -----------------------------------------------------------------------------

[tool.pytest]
addopts = ["--import-mode=importlib"]

# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 79

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

# -----------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "12.0" }]

[tool.pixi.dependencies]
pytorch-gpu = ">=2.14.1,<3"
cuda-version = ">=12.9,<13"
ipython = ">=9.17.1,<10"
uproot = ">=5.7.7,<6"
jupyterlab = ">=4.6.4,<5"

[tool.pixi.pypi-dependencies]
xyh_ml = { path = ".", editable = true }

[tool.pixi.tasks]
