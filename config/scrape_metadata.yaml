# -----------------------------------------------------------------------------
# Default configuration for the training
# -----------------------------------------------------------------------------

defaults:
- base/artifacts@artifacts
- base/campaigns@campaigns
- base/channels@channels
- base/data_source@data_source
- base/dataset@dataset
- base/mode@mode
- base/network@network
- base/outputs@outputs
- base/tags@tags
- base/training@training
- _ntuple@ntuple
- inputs: y2b_h2tau
- _self_

metadata_file: data/output/friends/${ntuple.tag}/metadata/metadata.json.gz


# -----------------------------------------------------------------------------
# Hydra configuration
# -----------------------------------------------------------------------------

hydra:
  run:
    dir: output/hydra/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
  verbose: INFO