# -----------------------------------------------------------------------------
# Hydra configuration
# -----------------------------------------------------------------------------

hydra:
  run:
    dir: output/hydra/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
  verbose: INFO