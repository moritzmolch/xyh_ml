# -----------------------------------------------------------------------------
# Default configuration for the friend production
# -----------------------------------------------------------------------------

defaults:
- base/artifacts@artifacts
- base/campaigns@campaigns
- base/data_source@data_source
- base/dataset@dataset
- base/mode@mode
- base/network@network
- base/outputs@outputs
- base/tags@tags
- base/training@training
- _ntuple@ntuple
- inputs: y2b_h2tau
- _self_

# One file per sample: <metadata_dir>/<era>/<sample>.json.gz
metadata_dir: data/output/friends/${ntuple.tag}/metadata

# Main ntuple files to produce friend files for, one friend file per input
# file, e.g. `input_files=['root://server//store/.../f_0.root']`. Each path has
# to end in <era>/<sample>/<channel>/<file name>, and the file has to be in the
# metadata file of its sample. Use xyh_ml.cli.friends.produce_many to process
# whole samples.
#
# The analysis channel is taken from each file (`mode.channel` is not used), so
# that the models trained for this channel are loaded.
input_files: []

# Skip input files whose friend file exists already (friend files are only
# written to their final path when complete)
skip_existing: false

# Name of the friend. By default, the output file is written to
# <output_dir>/<era>/<sample>/<channel>/<file name of the input file>,
# mirroring the CROWN friend directory layout.
friend_name: pnn-${tags.training_tag}-${mode.decay_mode}
output_dir: data/output/friends/${ntuple.tag}/CROWNFriend/${friend_name}

# Tag of the NN friend on the XRootD server. If set, the friend files are
# uploaded to the friend directory `<nn_friend_tag>-<decay mode>` next to the
# other friends of the ntuples (`output_dir` is not used):
# <ntuple.xrootd_server>//<ntuple.base_dir>/<ntuple.tag>/CROWNFriend/
#   <nn_friend_tag>-<mode.decay_mode>/<era>/<sample>/<channel>/<file name>
# The files are written to a temporary directory in `staging_dir` first.
nn_friend_tag: null
staging_dir: data/output/friends/staging

# Optional JSON file for the profile of the friend production (time per stage
# per event and per row, data frame sizes, peak memory). The profile is always
# logged.
profile_file: null

# Optional JSON file listing the input files that were produced, skipped or
# failed
status_file: null

# Number of events evaluated at once. Every event is evaluated for every
# entry in `parameter_values`, so a chunk has
# chunk_size * len(parameter_values) rows. The peak memory grows by about
# 175 KiB per event of a chunk (about 1.7 GiB for 10000 events); larger chunks
# are not faster.
chunk_size: 10000

