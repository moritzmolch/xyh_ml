# -----------------------------------------------------------------------------
# Output variables
# -----------------------------------------------------------------------------

variables:
- name: "class"
  transformation: "ordinal_encoding"

# -----------------------------------------------------------------------------
# Process classes
# -----------------------------------------------------------------------------

classes:
# -----------------------------------------------------------------------------
- name: "xyh"
  label: "$\\text{X} \\to \\text{H}\\text{Y}$"
  file_basenames:
  - "xyh_y2.*_h2.*_mx.*_my.*_.*nominal"
  is_signal: true
# -----------------------------------------------------------------------------
- name: "t_tt"
  label: "$\\text{t}+$\\text{t}\\bar{\\text{t}}$"
  file_basenames:
  - "single_t_rem.*nominal"
  - "single_t_tautau.*nominal"
  - "tt_rem.*nominal"
  - "tt_tautau.*nominal"
  is_signal: false
# -----------------------------------------------------------------------------
- name: "z2tau"
  label: "Z($\\tau\\tau$)"
  file_basenames:
  - "z_2tau_tautau.*nominal"
  is_signal: false
# -----------------------------------------------------------------------------
- name: "jetfakes"
  label: "$\\text{j} \\to \\tau_{\\text{h}}$"
  file_basenames:
  - "data.*fake_factors"
  is_signal: false
  columns:
  - "ntuple_fake_factor"
