# -----------------------------------------------------------------------------
# Default configuration for the snapshot preprocessing
# -----------------------------------------------------------------------------

defaults:
- data: et
- _self_

# -----------------------------------------------------------------------------
# Preprocessing parameters
# -----------------------------------------------------------------------------

# Tag of the training run the preprocessed data belongs to
training_tag: ???

# Directory to save the preprocessed HDF5 files to
output_dir: ???

# Data-taking campaign to process
campaign: ???

# Analysis category to process
category: ???

# Analysis channel (inferred from the data configuration by default)
channel: ${data.data_source.channel}

# -----------------------------------------------------------------------------
# Hydra configuration
# -----------------------------------------------------------------------------

hydra:
  run:
    dir: output/hydra/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
